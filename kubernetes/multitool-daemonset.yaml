apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-multitool
  labels:
    tier: node
    app: network-multitool
spec:
  selector:
    matchLabels:
      tier: node
      app: network-multitool
  template:
    metadata:
      labels:
        tier: node
        app: network-multitool
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      tolerations:
      - operator: Exists
        effect: NoSchedule
      containers:
      - name: network-multitool
        image: wbitt/network-multitool:3.24.3
        imagePullPolicy: IfNotPresent
        env:
        - name: HTTP_PORT
          value: "1180"
        - name: HTTPS_PORT
          value: "11443"
        ports:
        - containerPort: 1180
          name: http-port
        - containerPort: 11443
          name: https-port
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        # Keep these probe ports in sync with HTTP_PORT.
        startupProbe:
          httpGet:
            path: /
            port: 1180
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /
            port: 1180
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 1180
          periodSeconds: 20
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
